[workspace]
members = [
    "packages/agent/driver",
    "packages/approval/driver",
    "packages/file/driver",
    "packages/frontend/driver",
    "packages/message/driver",
    "packages/skill/driver",
    "packages/telegram/driver",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
kas-core = { path = "../crates/kas-core" }
kas-driver = { path = "../crates/kas-driver" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
