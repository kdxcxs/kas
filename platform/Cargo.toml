[workspace]
members = [
    "packages/agent/driver",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
kas-core = { path = "../crates/kas-core" }
kas-driver = { path = "../crates/kas-driver" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
