[workspace]
members = [
    "apps/kas-admin",
    "apps/kas-api",
    "apps/kas-builtin-driver",
    "apps/kas-migrate",
    "apps/kas-test-driver",
    "benchmarks/kas-benchmark",
    "crates/kas-core",
    "crates/kas-auth",
    "crates/kas-driver",
    "crates/kas-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
kas-core = { path = "crates/kas-core" }
kas-auth = { path = "crates/kas-auth" }
kas-driver = { path = "crates/kas-driver" }
kas-store = { path = "crates/kas-store" }
jsonschema = { version = "0.48.5", default-features = false }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
r2d2_sqlite = "0.25"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tar = "0.4"
url = "2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
